<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sea Vixen Side Scroller</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: #87ceeb;
      color: #053a5c;
    }

    #gameContainer {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
      background: linear-gradient(to bottom, #87ceeb 0%, #9dd4ff 45%, #72b7e8 100%);
    }

    #hud {
      position: absolute;
      left: 16px;
      top: 16px;
      z-index: 10;
      color: #e5f9ff;
      text-shadow: 0 0 12px rgba(0, 0, 0, 0.5);
    }

    #hud small {
      display: block;
      margin-top: 6px;
      color: #c7e9ff;
    }

    #referenceBox {
      position: absolute;
      bottom: 16px;
      left: 16px;
      z-index: 10;
      width: min(220px, 18vw);
      padding: 10px;
      background: rgba(255, 255, 255, 0.82);
      border: 1px solid rgba(5, 58, 92, 0.25);
      border-radius: 12px;
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.12);
      backdrop-filter: blur(8px);
    }

    #referenceImage {
      display: block;
      width: 100%;
      height: auto;
      max-height: 140px;
      object-fit: contain;
      border-radius: 8px;
      opacity: 0.92;
    }

    #referenceCaption {
      margin-top: 8px;
      font-size: 12px;
      color: #053a5c;
      text-align: center;
      line-height: 1.3;
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <div id="gameContainer">
    <canvas id="gameCanvas" width="1024" height="576"></canvas>
    <div id="referenceBox">
      <img id="referenceImage" alt="Sea Vixen reference" />
      <div id="referenceCaption">this is what you're supposed to look like btw</div>
    </div>
    <div id="hud">
      <div id="scoreLabel">Score: 0</div>
    </div>
    <script>
      const referenceImages = [
        'Training images/Sea Vixen/Sea_Vixen_FAW2.jpg',
        'Training images/Sea Vixen/Sea_Vixen_prototype_landing_on_HMS_Albion_(R07)_in_1954.jpg',
        'Training images/Sea Vixen/Sea_vixens_refuelling_arp.jpg',
        'Training images/Sea Vixen/Sea.vixen.flying.arp.jpg',
        'Training images/Sea Vixen/De_Havilland_DH-110_Sea_Vixen_FAW2,_UK_-_Navy_AN2233191.jpg',
        'Training images/Sea Vixen/DH_Sea_Vixen_(490287260).jpg',
        'Training images/Sea Vixen/de-Havilland-Sea-Vixen.jpg',
        'Training images/Sea Vixen/havilland-sea-vixen-faw2-xp953-40613211.jpg.webp',
      ];
      const refImage = document.getElementById('referenceImage');
      const selected = referenceImages[Math.floor(Math.random() * referenceImages.length)];
      refImage.src = encodeURI(selected);
      refImage.onerror = () => {
        refImage.style.display = 'none';
      };
    </script>
  </div>
  <script src="game.js"></script>
</body>
</html>
